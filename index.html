<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 15px;
        }

        h1 {
            color: #00e5ff;
        }

        .box {
            background: #202c39;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }

        button {
            background: #00c853;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome to My Website!</h1>
        <p>This is my first website.</p>
        <button onclick="alert('Welcome!')">
            Click Me
        </button>
    </div>

</body>
</html>
